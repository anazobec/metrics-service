          type: boolean
          readOnly: true
          description: Whether this is a system-defined task that cannot be easily
            deleted
        status:
          enum:
          - pending
          - running
          - completed
          - failed
          - cancelled
          type: string
          description: |-
            * `pending` - Pending
            * `running` - Running
            * `completed` - Completed
            * `failed` - Failed
            * `cancelled` - Cancelled
          readOnly: true
