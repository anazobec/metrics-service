                    collectors:
                    - name: controller.unified_jobs_dashboard
                      description: Job executions, including status and timing, organization,
                        inventory, project, template, execution environment, launcher,
                        labels, and host count. The nested installed_collections object
                        is keyed by collection FQCN.
                      payload_shape: array
                      key_field: null
                      mode: hourly
                      accepts_since_until: true
                      last_collect: null
                      rows_url: https://metrics.example.com/api/v1/analytics/controller.unified_jobs_dashboard/
                      collect_url: https://metrics.example.com/api/v1/analytics/controller.unified_jobs_dashboard/collect/
                    - name: controller.unified_jobs
                      description: Unified job records with status, timing, organization,
                        inventory, execution environment, template, project SCM type,
                        and job details. The nested installed_collections object is
                        keyed by collection FQCN.
                      payload_shape: array
                      key_field: null
                      mode: hourly
                      accepts_since_until: true
                      last_collect: null
                      rows_url: https://metrics.example.com/api/v1/analytics/controller.unified_jobs/
                      collect_url: https://metrics.example.com/api/v1/analytics/controller.unified_jobs/collect/
                    - name: controller.job_host_summary_service
