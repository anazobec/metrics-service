      description: Serializer for viewing and updating the SubscriptionCost singleton
        record.
      properties:
        monthly_subscription_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          description: Monthly subscription cost for AAP subscription
        engineer_avg_hourly_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          description: Average hourly rate for engineers performing manual work
        include_template_creation_time_in_costs:
          type: boolean
          description: Include template creation time in cost calculations. If false,
            costs related to template creation time will be excluded.
    PatchedTaskExecutionRequest:
      type: object
      description: Serializer for TaskExecution model for execution tracking and monitoring.
      properties:
        task:
          type: string
          format: uri
          description: The task that was executed
        status:
          enum:
          - pending
          - running
          - completed
          - failed
          - cancelled
          type: string
          description: |-
            * `pending` - Pending
            * `running` - Running
            * `completed` - Completed
            * `failed` - Failed
            * `cancelled` - Cancelled
        worker_id:
          type: string
          nullable: true
          description: ID of the worker that executed the task
          maxLength: 100
        result_data:
          type: object
          additionalProperties: {}
          description: JSON result data from this execution
        error_message:
          type: string
          description: Error message if execution failed
    PatchedTaskRequest:
      type: object
      description: |-
        Main serializer for Task model with comprehensive functionality.

        This serializer provides task creation, scheduling, and monitoring
        capabilities for the dashboard interface and includes all fields
        needed for task management.
      properties:
        name:
          type: string
          minLength: 1
          description: The name of this resource.
          maxLength: 512
        function_name:
          type: string
          minLength: 1
          description: Name of the function to execute (must match TASK_FUNCTIONS)
          maxLength: 255
        task_data:
          type: object
          additionalProperties: {}
          description: JSON data to pass to the task function
        scheduled_time:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 format datetime when task should run
        cron_expression:
          type: string
          nullable: true
          description: Cron expression for recurring tasks (e.g., '0 2 * * *')
          maxLength: 100
        max_attempts:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Maximum number of retry attempts
