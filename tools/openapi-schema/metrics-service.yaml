                        and job, template, inventory, organization, and project context.
                      payload_shape: array
                      key_field: null
                      mode: hourly
                      accepts_since_until: true
                      last_collect: null
                      rows_url: https://metrics.example.com/api/v1/analytics/controller.job_host_summary/
                      collect_url: https://metrics.example.com/api/v1/analytics/controller.job_host_summary/collect/
                    - name: controller.credentials_service
                      description: Distinct managed credential types used by jobs
                        completed in the collection window.
                      payload_shape: array
                      key_field: null
                      mode: hourly
                      accepts_since_until: true
