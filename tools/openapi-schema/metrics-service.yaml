components:
  schemas:
    ActivityLevel:
      type: object
      description: A per-user leaderboard for one activity level (volume / breadth
        / consistency).
      properties:
        id:
          type: string
          description: 'Activity level id: volume, breadth or consistency'
        current_user_rank:
          type: integer
          nullable: true
          description: Rank of the current user (None if they have no runs)
        current_user_runs:
          type: integer
          description: Current user's value of this activity level's metric (0 if
            they have no runs)
        total_users:
          type: integer
          description: Users the rank is out of
        leaderboard:
          type: array
          items:
            $ref: '#/components/schemas/ActivityLevelRow'
      required:
      - current_user_rank
      - current_user_runs
      - id
      - leaderboard
      - total_users
    ActivityLevelRow:
      type: object
      description: One user on an activity-level leaderboard.
      properties:
        rank:
          type: integer
          description: 1-based position
        username:
          type: string
          description: Full username for the current user, otherwise the first two
            letters upper-cased
        runs:
          type: integer
          description: Value of this activity level's metric
        is_current_user:
          type: boolean
          description: Present and true only for the current user
      required:
      - rank
      - runs
      - username
