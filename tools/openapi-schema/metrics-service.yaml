    Report:
      type: object
      description: |-
        Serializer for per-template aggregated report rows.

        Each row represents a single job template with aggregated run counts, elapsed
        time, cost estimates, and savings calculations across the selected date range.
      properties:
        template_name:
          type: string
          readOnly: true
        id:
          type: integer
          readOnly: true
        time_taken_manually_execute_minutes:
          type: integer
          readOnly: true
          description: Estimated time to perform this task manually (minutes)
        time_taken_create_automation_minutes:
          type: integer
          readOnly: true
          description: Estimated time spent creating this automation (minutes)
        runs:
          type: integer
          readOnly: true
          description: Total number of times this job template was executed
        successful_runs:
          type: integer
          readOnly: true
          description: Number of successful runs
        failed_runs:
          type: integer
          readOnly: true
          description: Number of failed runs
        elapsed:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          description: Total elapsed time for all runs (seconds)
        elapsed_str:
          type: string
          description: Total elapsed time for all runs (human-readable string)
          readOnly: true
        automated_costs:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          readOnly: true
          description: Estimated costs of running this job template on AAP
        manual_costs:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          readOnly: true
          description: Estimated costs if all jobs were run manually
        time_savings:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          readOnly: true
          description: Estimated time savings in seconds by automating this job template
        time_savings_str:
          type: string
          description: Estimated time savings by automating this job template (human-readable
            string)
          readOnly: true
        savings:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          readOnly: true
          description: Estimated cost savings by automating this job template
        label_ids:
          type: array
          items:
            type: integer
          readOnly: true
          description: AWX label IDs associated with jobs of this template in the
            selected date range
      required:
      - elapsed
    ReportChart:
      type: object
