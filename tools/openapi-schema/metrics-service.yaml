                        template, inventory, organization, and project context.
                      payload_shape: array
                      key_field: null
                      mode: hourly
                      accepts_since_until: true
                      last_collect: null
                      rows_url: https://metrics.example.com/api/v1/analytics/controller.job_host_summary_service/
                      collect_url: https://metrics.example.com/api/v1/analytics/controller.job_host_summary_service/collect/
                    - name: controller.job_host_summary
