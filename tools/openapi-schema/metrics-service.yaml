    ReportDetail:
      type: object
      description: |-
        Serializer for the dashboard detail endpoint response.

        Aggregates total run counts, cost figures, time savings, unique host count,
        top users, top projects, and chart series data for the selected date range.
      properties:
        total_number_of_job_runs:
          type: integer
          readOnly: true
          description: Total number of job runs
        total_number_of_successful_jobs:
          type: integer
          readOnly: true
          description: Total number of successful job runs
        total_number_of_failed_jobs:
          type: integer
          readOnly: true
          description: Total number of failed job runs
        total_number_of_host_job_runs:
          type: integer
          readOnly: true
          description: Total number of host job runs (sum of all hosts across all
            jobs)
        total_hours_of_automation:
          type: number
          format: double
          description: Total hours of automation
          readOnly: true
        cost_of_automated_execution:
          type: number
          format: double
          description: Total cost of automated execution
          readOnly: true
        cost_of_manual_automation:
          type: number
          format: double
          description: Total cost of manual execution
          readOnly: true
        total_saving:
          type: number
          format: double
          description: Total savings from automation (manual costs - automated costs)
          readOnly: true
        total_time_saving:
          type: number
          format: double
          description: Total time savings from automation (in hours)
          readOnly: true
        total_number_of_unique_hosts:
          type: integer
          readOnly: true
          description: Total number of unique hosts across all job runs
        top_users:
          type: array
          items:
            $ref: '#/components/schemas/TopUser'
          readOnly: true
          description: List of top users who executed the most jobs
        top_projects:
          type: array
          items:
            $ref: '#/components/schemas/TopProject'
          readOnly: true
          description: List of top projects associated with the most job executions
        job_chart:
          allOf:
          - $ref: '#/components/schemas/ReportChart'
          readOnly: true
          description: Chart data showing job executions over time
        host_chart:
          allOf:
          - $ref: '#/components/schemas/ReportChart'
          readOnly: true
          description: Chart data showing host job runs over time
