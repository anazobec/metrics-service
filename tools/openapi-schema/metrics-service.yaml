          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the process completed
        error_message:
          type: string
          readOnly: true
          description: Error message if process failed
        created_by:
          type: integer
          readOnly: true
        created_by_username:
          type: string
          readOnly: true
