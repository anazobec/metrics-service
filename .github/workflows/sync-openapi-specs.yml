---
name: Sync OpenAPI Spec

env:
  LC_ALL: "C.UTF-8"

on:
  push:
    branches:
      - devel
      - "stable-*"
    paths:
      - "apps/**/*.py"
      - "apps/**/serializers.py"
      - "apps/**/viewsets/**"
      - "apps/**/views/**"
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: read

jobs:
  generate:
    name: Generate and validate OpenAPI spec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout metrics-service
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v7

      - name: Install dependencies
        run: uv sync --frozen

      - name: Generate and validate OpenAPI schema
        env:
          DJANGO_SETTINGS_MODULE: metrics_service.settings
          METRICS_SERVICE_SECRET_KEY: "ci-placeholder-not-secret"
          # Use SQLite in memory so Django starts up without a real postgres instance
          METRICS_SERVICE_DATABASES__default__ENGINE: django.db.backends.sqlite3
          METRICS_SERVICE_DATABASES__default__NAME: ":memory:"
          METRICS_SERVICE_DATABASES__awx__ENGINE: django.db.backends.sqlite3
          METRICS_SERVICE_DATABASES__awx__NAME: ":memory:"
        run: |
          uv run --frozen python manage.py spectacular \
            --color \
            --file metrics.json \
            --validate \
            --format openapi-json

      - name: Upload OpenAPI static specification
        uses: actions/upload-artifact@v7
        with:
          name: openapi-schema
          path: metrics.json
          retention-days: 1

  sync:
    name: Sync OpenAPI spec to central repo
    needs: generate
    runs-on: ubuntu-latest
    if: github.repository == 'ansible-automation-platform/metrics-service'
    permissions:
      contents: read

    steps:
      - name: Download spec artifact from component workflow
        uses: actions/download-artifact@v8
        with:
          name: openapi-schema
          path: ./component-spec

      - name: Verify spec file exists
        run: |
          SPEC_FILE="./component-spec/metrics.json"
          if [ ! -f "$SPEC_FILE" ]; then
            echo "❌ Spec file not found at $SPEC_FILE"
            echo "Contents of artifact:"
            ls -la ./component-spec/
            exit 1
          fi
          echo "✅ Found spec file at $SPEC_FILE"

      - name: Check if branch exists in spec repo
        id: check_branch
        env:
          SPEC_SYNC_TOKEN: ${{ secrets.OPENAPI_SPEC_SYNC_TOKEN }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads \
            "https://x-access-token:${SPEC_SYNC_TOKEN}@github.com/ansible-automation-platform/aap-openapi-specs.git" \
            "refs/heads/${SOURCE_BRANCH}" > /dev/null 2>&1; then
            echo "✅ Branch '${SOURCE_BRANCH}' exists in spec repo"
            echo "branch_exists=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Branch '${SOURCE_BRANCH}' does NOT exist in spec repo"
            echo "branch_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Fail if branch doesn't exist
        if: steps.check_branch.outputs.branch_exists != 'true'
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          echo "##[error]❌ Branch '${SOURCE_BRANCH}' does not exist in the central spec repository."
          echo "##[error]Expected branch: ${SOURCE_BRANCH}"
          echo "##[error]This branch must be created in the spec repo before specs can be synced."
          exit 1

      - name: Checkout spec repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ansible-automation-platform/aap-openapi-specs
          ref: ${{ github.ref_name }}
          path: spec-repo
          token: ${{ secrets.OPENAPI_SPEC_SYNC_TOKEN }}
          persist-credentials: false

      - name: Compare specs
        id: compare
        run: |
          COMPONENT_SPEC="./component-spec/metrics.json"
          SPEC_REPO_FILE="spec-repo/metrics.json"

          if [ ! -f "$SPEC_REPO_FILE" ]; then
            echo "Spec file doesn't exist in spec repo - will create new file"
            echo "has_diff=true" >> $GITHUB_OUTPUT
            echo "is_new_file=true" >> $GITHUB_OUTPUT
          else
            if diff -q "$COMPONENT_SPEC" "$SPEC_REPO_FILE" > /dev/null; then
              echo "✅ No differences found - specs are identical"
              echo "has_diff=false" >> $GITHUB_OUTPUT
            else
              echo "📝 Differences found - spec has changed"
              echo "has_diff=true" >> $GITHUB_OUTPUT
              echo "is_new_file=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Update spec file
        if: steps.compare.outputs.has_diff == 'true'
        run: |
          cp "./component-spec/metrics.json" "spec-repo/metrics.json"
          echo "✅ Updated spec-repo/metrics.json"

      - name: Create or update PR in spec repo
        id: create_pr
        if: steps.compare.outputs.has_diff == 'true'
        working-directory: spec-repo
        env:
          GH_TOKEN: ${{ secrets.OPENAPI_SPEC_SYNC_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.OPENAPI_SPEC_SYNC_GPG_PRIVATE_KEY }}
          SPEC_REPO: ansible-automation-platform/aap-openapi-specs
          SPEC_PR_REVIEW_TEAM: ${{ secrets.OPENAPI_SPEC_PR_REVIEW_TEAM }}
          SPEC_BRANCH: ${{ github.ref_name }}
          SOURCE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Import GPG key and configure git for signed commits
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import 2>/dev/null
          GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format long 2>/dev/null | grep sec | head -1 | awk '{print $2}' | cut -d'/' -f2)
          if [ -z "$GPG_KEY_ID" ]; then
            echo "❌ Failed to import GPG key or extract key ID"
            exit 1
          fi
          git config user.name "aap-api-bot"
          git config user.email "aap-api-bot@redhat.com"
          git config commit.gpgsign true
          git config user.signingkey "$GPG_KEY_ID"

          # Configure git to use the token for push
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${SPEC_REPO}.git"

          # Use a stable branch name so we can reuse it across runs
          BRANCH_NAME="auto/update-metrics-service-${SPEC_BRANCH}"

          # Check if there's already an open PR from this branch
          EXISTING_PR=$(gh pr list \
            --repo "$SPEC_REPO" \
            --head "$BRANCH_NAME" \
            --base "$SPEC_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING_PR" ]; then
            echo "📝 Found existing PR #${EXISTING_PR} - will update it"
          else
            echo "📝 No existing PR found - will create a new one"
            # Clean up stale remote branch from a previously merged PR
            git push origin --delete "$BRANCH_NAME" 2>/dev/null || true
          fi

          git checkout -b "$BRANCH_NAME"

          # Add and commit changes
          git add "metrics.json"

          if [ "${{ steps.compare.outputs.is_new_file }}" == "true" ]; then
            COMMIT_MSG="Add metrics-service OpenAPI spec for ${SPEC_BRANCH}"
          else
            COMMIT_MSG="Update metrics-service OpenAPI spec for ${SPEC_BRANCH}"
          fi

          git commit -m "$COMMIT_MSG

          Synced from ${{ github.repository }}@${{ github.sha }}
          Source branch: ${SPEC_BRANCH}
          Spec repo branch: ${SPEC_BRANCH}

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          # Push branch
          git push --force origin "$BRANCH_NAME"

          # Create PR (commit message passed via env var to avoid script injection)
          PR_TITLE="[${SPEC_BRANCH}] Update metrics-service spec from merged commit"
          PR_BODY=$(cat <<EOF
          ## Summary
          Automated OpenAPI spec sync from component repository merge.

          **Source:** ${{ github.repository }}@${{ github.sha }}
          **Source Branch:** \`${SPEC_BRANCH}\`
          **Spec Repo Branch:** \`${SPEC_BRANCH}\`
          **Component:** \`metrics-service\`
          **Spec File:** \`metrics.json\`

          ## Changes
          $(if [ "${{ steps.compare.outputs.is_new_file }}" == "true" ]; then echo "- 🆕 New spec file created"; else echo "- 📝 Spec file updated with latest changes"; fi)

          ## Source Commit
          \`\`\`
          ${SOURCE_COMMIT_MESSAGE}
          \`\`\`

          ---
          🤖 This PR was automatically generated by the OpenAPI spec sync workflow.
          EOF
          )

          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" \
              --repo "$SPEC_REPO" \
              --body "$PR_BODY"
            echo "✅ Updated existing PR #${EXISTING_PR}"
          else
            gh pr create \
              --repo "$SPEC_REPO" \
              --title "$PR_TITLE" \
              --body "$PR_BODY" \
              --base "$SPEC_BRANCH" \
              --head "$BRANCH_NAME" \
              --reviewer "$SPEC_PR_REVIEW_TEAM"
            echo "✅ Created PR in spec repo"
          fi

      - name: Report results
        if: always()
        run: |
          if [ "${{ steps.create_pr.outcome }}" == "success" ]; then
            echo "📝 Spec sync completed - PR created in spec repo"
          elif [ "${{ steps.compare.outcome }}" == "success" ] && \
               [ "${{ steps.compare.outputs.has_diff }}" == "false" ]; then
            echo "✅ Spec sync completed - no changes needed"
          else
            echo "❌ Spec sync did not complete successfully"
          fi
